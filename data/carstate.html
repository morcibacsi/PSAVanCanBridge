 // --------------- VALUE MAPPINGS (UI-only) ------------------
// Format: display = raw * scale + offset
// raw = (display - offset) / scale
// integer: true -> round raw to integer before sending
// decimals: number of decimals to show in display UI
const valueMaps = {
  ExternalTemperature: { scale: 0.5, offset: -40, integer: true, decimals: 0 }, // raw 254 -> 87
  Speed: { scale: 0.01, offset: 0, integer: true, decimals: 0 },
  Rpm: { scale: 0.125, offset: 0, integer: true, decimals: 0 },
  Odometer: { scale: 0.1, offset: 0, integer: true, decimals: 0 },
  CoolantTemperature: { scale: 1, offset: -40, integer: true, decimals: 0 },
  // example: a voltage stored as raw=units of 0.1V -> display = raw * 0.1
  // BatteryVoltage: { scale: 0.1, offset: 0, integer: false, decimals: 1 },
  // Add other mappings here...
};

// --------------- HELPERS ------------------
const B1 = BigInt(1);
function maskFor(length, bitpos, useBigInt) {
  if (useBigInt) {
    return ((B1 << BigInt(length)) - B1) << BigInt(bitpos);
  } else {
    return (((1 << length) - 1) << bitpos) >>> 0;
  }
}
function toBigIntSafe(v) {
  if (typeof v === "bigint") return v;
  if (typeof v === "number") return BigInt(v);
  if (typeof v === "string" && v !== "") return BigInt(v);
  return BigInt(0);
}
function roundTo(n, decimals) {
  if (decimals == null) return n;
  const f = Math.pow(10, decimals);
  return Math.round(n * f) / f;
}
function formatDisplayValue(raw, map) {
  if (!map) return raw;
  const display = (Number(raw) * map.scale) + map.offset;
  return (map.decimals != null) ? roundTo(display, map.decimals) : display;
}
function computeRawFromDisplay(display, map) {
  if (!map) return display;
  const raw = (Number(display) - map.offset) / map.scale;
  if (map.integer) return Math.round(raw);
  return raw;
}

// --------------- FETCH + RENDER ------------------
async function fetchJson() {
  try {
    setStatus("Fetching...");
    const res = await fetch(API_ENDPOINT + "carstate.json");
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const json = await res.json();
    setStatus("Fetched");
    document.getElementById("preview").textContent = JSON.stringify(json, null, 2);
    return json;
  } catch (err) {
    setStatus("Fetch error: " + err.message);
    console.error(err);
    return null;
  }
}

function clearEditor(){ document.getElementById("editor").innerHTML = ""; }

function renderEditor(json) {
  clearEditor();
  const container = document.getElementById("editor");

  Object.entries(json).forEach(([key, value]) => {
    const isBitfield = !!bitfields[key];
    const div = document.createElement("div");
    div.className = isBitfield ? "card mb-2 carstate-bitfield-card" : "card mb-2 carstate-scalar-card";

    const body = document.createElement("div");
    body.className = "card-body zone-card-body";

    const label = document.createElement("label");
    label.className = "form-label";
    label.textContent = key;
    label.title = key;
    body.appendChild(label);

    if (isBitfield) {
      // bitfield editor (keeps BigInt handling)
      body.appendChild(renderBitfield(key, value, bitfields[key]));
    } else {
      // numeric or mapped field
      const map = valueMaps[key];
      const displayValue = map ? formatDisplayValue(value, map) : value;

      const inputRow = document.createElement("div");
      inputRow.className = "control-row";

      const inp = document.createElement("input");
      inp.type = "number";
      inp.className = "form-control form-control-sm";
      inp.id = key;
      // show display-friendly value
      inp.value = (displayValue === null || displayValue === undefined) ? "" : displayValue;
      if (map && map.decimals != null) inp.step = (1 / Math.pow(10, map.decimals)).toString();
      inp.dataset.mapped = map ? "1" : "0";
      inputRow.appendChild(inp);

      // show the raw value small note for reference (optional)
      const rawNote = document.createElement("span");
      rawNote.className = "setup-tip";
      rawNote.textContent = "(raw: " + String(value) + ")";
      inputRow.appendChild(rawNote);

      body.appendChild(inputRow);
    }

    div.appendChild(body);
    container.appendChild(div);
  });
}

// --------------- Bitfield render & compute (same BigInt-aware implementation) ------------------
function renderBitfield(name, incomingValue, def) {
  const wrapper = document.createElement("div");
  wrapper.className = "carstate-bitfield-bytes mb-2";

  let valueIsBigInt = !!def.isBigInt;
  let value;
  try {
    if (valueIsBigInt) value = toBigIntSafe(incomingValue || 0);
    else value = Number(incomingValue) || 0;
  } catch (e) {
    value = valueIsBigInt ? BigInt(0) : 0;
  }

  let bitPos = 0;
  let bitsInCurrentByte = 0;
  let currentByteRow = document.createElement("div");
  currentByteRow.className = "carstate-byte-row";

  const flushCurrentByteRow = () => {
    if (currentByteRow.children.length > 0) {
      wrapper.appendChild(currentByteRow);
      currentByteRow = document.createElement("div");
      currentByteRow.className = "carstate-byte-row";
    }
  };

  def.fields.forEach(([fieldName, length]) => {
    // Safety for malformed definitions: if a field would cross byte boundary,
    // start it on a new row so each visual row still represents one byte.
    if (bitsInCurrentByte > 0 && bitsInCurrentByte + length > 8) {
      flushCurrentByteRow();
      bitsInCurrentByte = 0;
    }

    const bitDiv = document.createElement("div");
    bitDiv.className = "control-row";
    bitDiv.style.gridColumn = `span ${length}`;

    const label = document.createElement("label");
    label.textContent = `${fieldName} (${length} bit${length>1 ? "s":""})`;
    label.title = fieldName;
    label.className = "carstate-bitfield-label";
    bitDiv.appendChild(label);

    if (length === 1) {
      let checked = false;
      if (valueIsBigInt) {
        const m = maskFor(1, bitPos, true);
        checked = (value & m) !== BigInt(0);
      } else {
        const m = maskFor(1, bitPos, false);
        checked = (value & m) !== 0;
      }
      const cb = document.createElement("input");
      cb.id = `bf-${name}-${fieldName}-${bitPos}`;
      cb.type = "checkbox";
      cb.className = "form-check-input";
      cb.checked = !!checked;
      cb.dataset.bf = name;
      cb.dataset.field = fieldName;
      cb.dataset.length = "1";
      cb.dataset.bitpos = String(bitPos);
      if (valueIsBigInt) cb.dataset.bigint = "1";
      label.htmlFor = cb.id;
      bitDiv.appendChild(cb);
    } else {
      const inp = document.createElement("input");
      inp.type = "number";
      inp.className = "form-control form-control-sm";
      inp.min = 0;
      inp.max = (1 << length) - 1;
      let fieldValue;
      if (valueIsBigInt) {
        const m = maskFor(length, bitPos, true);
        fieldValue = Number((value & m) >> BigInt(bitPos));
      } else {
        const m = maskFor(length, bitPos, false);
        fieldValue = (value & m) >>> bitPos;
      }
      inp.value = fieldValue;
      inp.dataset.bf = name;
      inp.dataset.field = fieldName;
      inp.dataset.length = String(length);
      inp.dataset.bitpos = String(bitPos);
      if (valueIsBigInt) inp.dataset.bigint = "1";
      bitDiv.appendChild(inp);
    }

    currentByteRow.appendChild(bitDiv);
    bitPos += length;
    bitsInCurrentByte += length;

    if (bitsInCurrentByte === 8) {
      flushCurrentByteRow();
      bitsInCurrentByte = 0;
    }
  });

  flushCurrentByteRow();

  const totalLine = document.createElement("div");
  totalLine.className = "setup-status";
  totalLine.textContent = "Value: " + (def.isBigInt ? (value.toString() + " (decimal)") : String(value));
  wrapper.appendChild(totalLine);

  wrapper.addEventListener("input", () => {
    const newVal = computeBitfieldValue(name, def);
    totalLine.textContent = "Value: " + (def.isBigInt ? (newVal.toString() + " (decimal)") : String(newVal));
  });

  return wrapper;
}

function computeBitfieldValue(bfName, def) {
  let useBigInt = !!def.isBigInt;
  let value = useBigInt ? BigInt(0) : 0;
  const elems = document.querySelectorAll(`*[data-bf="${bfName}"]`);
  elems.forEach(el => {
    const length = Number(el.dataset.length);
    const bitpos = Number(el.dataset.bitpos);
    if (length === 1) {
      const v = el.checked ? 1 : 0;
      if (useBigInt) value |= (BigInt(v) << BigInt(bitpos));
      else value |= (v << bitpos);
    } else {
      const raw = el.value === "" ? 0 : Number(el.value);
      const v = raw >>> 0;
      if (useBigInt) value |= (BigInt(v) << BigInt(bitpos));
      else value |= (v << bitpos);
    }
  });
  return value;
}

// --------------- Collect JSON (DISPLAY->RAW conversion here) ------------------
function collectJSON() {
  const result = {};

  // simple numeric fields (inputs with id)
  document.querySelectorAll("input[type=number]").forEach(inp => {
    const key = inp.id;
    if (!key) return; // skip bitfield internal numeric inputs (they have no id)

    // If mapped, convert from display -> raw
    const isMapped = inp.dataset.mapped === "1";
    if (isMapped) {
      const map = valueMaps[key];
      const displayVal = inp.value === "" ? 0 : Number(inp.value);
      const rawVal = computeRawFromDisplay(displayVal, map);
      // If map.integer true, round
      result[key] = map && map.integer ? Math.round(rawVal) : rawVal;
    } else {
      // not mapped: send numeric raw directly
      result[key] = inp.value === "" ? 0 : Number(inp.value);
    }
  });

  // bitfields: reconstruct values; if BigInt -> string decimal
  for (const bfName in bitfields) {
    const def = bitfields[bfName];
    const val = computeBitfieldValue(bfName, def);
    if (def.isBigInt)
    {
        result[bfName] = val.toString(); // decimal string (preserve full 64-bit)
    }
    else
    {
        result[bfName] = Number(val);
    }
  }

  return result;
}

function updatePreviewFromEditor() {
  const obj = collectJSON();
  document.getElementById("preview").textContent = JSON.stringify(obj, null, 2);
}

// --------------- POST ------------------
async function postJson(obj, options = {}) {
  const showAlert = options.showAlert !== false;
  const updatePreview = options.updatePreview !== false;
  const statusPrefix = options.statusPrefix || "Saving...";
  const loadingButtonId = options.loadingButtonId;
  const loadingText = options.loadingText || "Saving...";
  const timeoutMs = Number.isFinite(options.timeoutMs) ? options.timeoutMs : 1000;

  let loadingButton = null;
  let originalButtonText = "";
  const abortController = new AbortController();
  const timeoutHandle = setTimeout(() => {
    abortController.abort();
  }, timeoutMs);

  if (loadingButtonId) {
    loadingButton = document.getElementById(loadingButtonId);
    if (loadingButton) {
      originalButtonText = loadingButton.textContent;
      loadingButton.disabled = true;
      loadingButton.textContent = loadingText;
    }
  }

  try {
    setStatus(statusPrefix);
    const res = await fetch(API_ENDPOINT + "carstate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(obj),
      signal: abortController.signal
    });
    const text = await res.text();
    setStatus("Saved: " + (res.ok ? `${res.status}` : `Error ${res.status}`));
    if (updatePreview) {
      document.getElementById("preview").textContent = `Request body:\n${JSON.stringify(obj, null, 2)}\n\nServer response:\n${text}`;
    }
    if (showAlert) {
      alert("Server responded: " + (text || res.statusText));
    }
  } catch (err) {
    if (err && err.name === "AbortError") {
      setStatus("Save timeout after " + timeoutMs + " ms");
    } else {
      setStatus("Save error: " + err.message);
    }
    console.error(err);
    if (showAlert) {
      if (err && err.name === "AbortError") {
        alert("Save timed out after " + timeoutMs + " ms");
      } else {
        alert("Save failed: " + err.message);
      }
    }
  } finally {
    clearTimeout(timeoutHandle);
    if (loadingButton) {
      loadingButton.disabled = false;
      loadingButton.textContent = originalButtonText;
    }
  }
}

async function sendRightStickPulse() {
  const baseState = collectJSON();
  const lowState = { ...baseState, RightStickButtonPushed: 0 };
  const highState = { ...baseState, EmulateTripButtonPress: 1 };

  await postJson(highState, {
    showAlert: false,
    updatePreview: true,
    statusPrefix: "Sending Right Stick pulse low"
  });
/*

  await postJson(lowState, {

    updatePreview: true,
    statusPrefix: "Sending Right Stick pulse low"
  });
*/
  setStatus("Right Stick pulse sent");
}

// --------------- UI helpers ------------------
function setStatus(s) { document.getElementById("status").textContent = s; }

// --------------- Buttons ------------------
document.getElementById("saveBtn").addEventListener("click", () => {
  const obj = collectJSON();
  postJson(obj, {
    showAlert: false,
    loadingButtonId: "saveBtn",
    loadingText: "Saving..."
  });
});

document.getElementById("refreshBtn").addEventListener("click", async () => {
  const json = await fetchJson();
  if (json) renderEditor(json);
});

document.getElementById("rightStickPulseBtn").addEventListener("click", async () => {
  await sendRightStickPulse();
});

document.getElementById("showPreviewBtn").addEventListener("click", () => {
  const previewElement = document.getElementById("preview");
  previewElement.scrollIntoView({ behavior: "smooth", block: "start" });
});

document.getElementById("editor").addEventListener("input", () => {
  updatePreviewFromEditor();
});

document.getElementById("editor").addEventListener("change", () => {
  updatePreviewFromEditor();
});

// --------------- init ------------------
(async function init(){
  const json = await fetchJson();
  if (json) {
    renderEditor(json);
    updatePreviewFromEditor();
  }
})();
